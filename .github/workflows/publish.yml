name: Publish Package

on:
  release:
    types: [published]

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  npm:
    name: Publish to npm

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set Up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-case: false

      - name: Clean-Install Package
        run: npm ci

      - name: Publish
        run: npm stage publish
